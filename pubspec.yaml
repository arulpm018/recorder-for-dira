name: recorder_mobile
description: Recorder for Dira - Audio recording app for CSV transcriptions (iOS & Android)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  csv: ^5.1.1
  file_picker: ^8.0.6
  path_provider: ^2.1.4
  path: ^1.9.0
  record: ^6.1.0
  audioplayers: ^6.0.0
  intl: ^0.19.0
  share_plus: ^10.0.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png 